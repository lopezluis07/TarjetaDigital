<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarjeta de Presentación</title>
<meta name="description" content="Tarjeta de presentación digital">
<!-- Vista previa al compartir el enlace por WhatsApp / redes -->
<meta property="og:title" content="Adrian Iturbide">
<meta property="og:description" content="Gerente Admistrativa Colomich SAS">
<!-- <meta property="og:image" content="https://TU-URL/foto.jpg"> -->
<!-- Ícono de pestaña: tarjeta de contacto -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='4' y='16' width='92' height='68' rx='12' fill='%23C8483D'/><circle cx='32' cy='44' r='11' fill='%23fff'/><path d='M16 70a16 14 0 0 1 32 0z' fill='%23fff'/><rect x='56' y='36' width='28' height='7' rx='3.5' fill='%23fff'/><rect x='56' y='50' width='22' height='6' rx='3' fill='%23fff' opacity='.75'/><rect x='56' y='62' width='26' height='6' rx='3' fill='%23fff' opacity='.75'/></svg>">

<style>
  /* ============ TOKENS DE COLOR ============ */
  :root {
    --paper: #17241C;      /* fondo oscuro (contraste con la tarjeta) */
    --surface: #FFFFFF;    /* tarjeta */
    --ink: #24342A;        /* texto principal */
    --muted: #6F7F74;      /* texto secundario */
    --line: #E4EAE1;       /* divisores */
    --accent: #C8483D;     /* rojo cereza de café */
    --accent-ink: #FFFFFF;
    --leaf: #5C9070;       /* verde hoja */
    --contour: rgba(92,144,112,.20);

    --serif: "Iowan Old Style", "Charter", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* Siempre en tonos claros: no se aplica el modo oscuro del sistema */
  :root { color-scheme: light; }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%;
    background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    max-width: 440px; margin: 0 auto; min-height: 100vh;
    background: var(--surface);
    display: flex; flex-direction: column;
  }
  @media (min-width: 520px) {
    body { padding: 32px 16px; }
    .card { min-height: auto; border-radius: 22px; overflow: hidden;
            box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  }

  /* ============ CABECERA CON CURVAS DE NIVEL ============ */
  .hero { position: relative; padding: 20px 24px 0; }
  .hero svg.contours {
    position: absolute; inset: 0; width: 100%; height: 170px;
    color: var(--contour); pointer-events: none;
  }
  .topbar { position: relative; display: flex; justify-content: flex-end; gap: 8px; }
  .chip {
    font: 600 13px/1 var(--sans); color: var(--ink);
    background: var(--surface); border: 1px solid var(--line);
    padding: 8px 12px; border-radius: 999px; cursor: pointer;
  }
  .avatar {
    position: relative; width: 112px; height: 112px; margin-top: 44px;
    border-radius: 50%; border: 4px solid var(--surface);
    background: var(--leaf); color: var(--surface);
    display: grid; place-items: center; overflow: hidden;
    font: 600 40px/1 var(--serif);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  /* Cuando se muestra el logo: completo, sin recortes, sobre blanco */
  .avatar.is-logo {
    width: 150px; height: 150px; border-radius: 24px; border: 0;
    background: #fff; padding: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,.12);
  }
  .avatar.is-logo img { object-fit: contain; }

  .identity { padding: 16px 24px 4px; }
  .name {
    font-family: var(--serif); font-weight: 600;
    font-size: clamp(38px, 11vw, 46px); line-height: 1.02;
    letter-spacing: -0.015em; margin: 0;
  }
  .role { margin: 10px 0 0; font-size: 17px; color: var(--ink); }
  .org { margin: 2px 0 0; color: var(--muted); font-size: 15px; }

  /* ============ BOTÓN PRINCIPAL ============ */
  .primary {
    margin: 24px 24px 8px; display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 14px; padding: 16px;
    font: 600 17px/1 var(--sans); cursor: pointer; text-decoration: none;
  }
  .primary:active { transform: scale(.985); }

  /* ============ LISTA DE CONTACTO ============ */
  .group-title {
    display: flex; align-items: center; gap: 10px;
    margin: 22px 24px 2px; font: 700 12px/1 var(--sans);
    letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  }
  .group-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .group-title small { font-weight: 500; letter-spacing: .04em; text-transform: none; }
  .flag { width: 24px; height: 16px; border-radius: 3px; flex: none;
          box-shadow: 0 0 0 1px rgba(0,0,0,.12); }
  .links { list-style: none; margin: 4px 0 0; padding: 0 24px; }
  .links li + li { border-top: 1px solid var(--line); }
  .links a {
    display: grid; grid-template-columns: 40px 1fr; align-items: center; gap: 14px;
    padding: 14px 0; color: inherit; text-decoration: none;
  }
  .icon {
    width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--leaf) 14%, transparent); color: var(--leaf);
  }
  .icon svg { width: 20px; height: 20px; }
  .links .label { display: block; font-weight: 600; }
  .links .value { display: block; color: var(--muted); font-size: 14px;
                  overflow-wrap: anywhere; }

  /* ============ PIE ============ */
  .footer { margin-top: auto; padding: 28px 24px 28px; display: flex; gap: 10px; }
  .secondary {
    flex: 1; padding: 14px; border-radius: 12px; cursor: pointer;
    background: transparent; color: var(--ink); border: 1px solid var(--line);
    font: 600 15px/1 var(--sans);
  }

  /* ============ MODAL QR ============ */
  dialog {
    border: 0; border-radius: 20px; padding: 28px; max-width: 320px; width: calc(100% - 40px);
    background: var(--surface); color: var(--ink); text-align: center;
  }
  dialog::backdrop { background: rgba(10,18,13,.6); }
  #qr { background: #fff; padding: 14px; border-radius: 12px; display: inline-block; }
  #qr img, #qr canvas { display: block; width: 220px; height: 220px; }
  dialog p { color: var(--muted); font-size: 14px; margin: 14px 0 18px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 20px); opacity: 0; transition: .25s;
    background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px;
    font-size: 14px; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<main class="card">
  <header class="hero">
    <!-- Curvas de nivel: guiño a las montañas del Quindío -->
    <svg class="contours" viewBox="0 0 440 170" preserveAspectRatio="none" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.2">
      <path d="M-10 150 C 60 110, 120 140, 190 100 S 330 60, 450 90"/>
      <path d="M-10 128 C 70 92, 130 118, 200 80 S 330 42, 450 66"/>
      <path d="M-10 106 C 80 74, 140 96, 210 60 S 335 24, 450 44"/>
      <path d="M-10 84 C 90 56, 150 74, 220 40 S 340 8, 450 22"/>
      <path d="M-10 62 C 100 38, 160 52, 230 20 S 345 -8, 450 0"/>
      <path d="M-10 40 C 110 20, 170 30, 240 0"/>
    </svg>
    <div class="topbar">
      <button class="chip" id="langBtn" aria-label="Cambiar idioma">EN</button>
    </div>
    <div class="avatar" id="avatar"></div>
  </header>

  <section class="identity">
    <h1 class="name" id="name"></h1>
    <p class="role" data-i18n="role"></p>
    <p class="org" id="org"></p>
  </section>

  <button class="primary" id="saveBtn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
    <span data-i18n="save"></span>
  </button>

  <div id="links"></div>

  <footer class="footer">
    <button class="secondary" id="qrBtn" data-i18n="showQr"></button>
    <button class="secondary" id="shareBtn" data-i18n="share"></button>
  </footer>
</main>

<dialog id="qrDialog">
  <div id="qr"></div>
  <p data-i18n="qrHint"></p>
  <button class="secondary" id="closeQr" style="width:100%" data-i18n="close"></button>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Generador de QR para mostrarlo en pantalla (opcional) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
/* =====================================================================
   1) EDITA SOLO ESTE BLOQUE CON TUS DATOS
   ===================================================================== */
const CONFIG = {
  firstName: "Adrián",
  lastName:  "Iturbide",
  photo: "",                       // ej. "foto.jpg" — si hay foto, se muestra en lugar del logo
  logo: "logo.png",                // se muestra completo cuando no hay foto (vacío = iniciales)
  org: "Colomich SAS",
  email: "gerencia@colomichsas.com",
  website: "https://www.colomichsas.com/",
  linkedin: "https://linkedin.com/in/tu-usuario",
  // Datos por país (formato internacional). Deja un campo vacío ("") para ocultarlo.
  countries: [
    { flag: "co", name: { es: "Colombia", en: "Colombia" },
      phone: "+57 310 667 7306", whatsapp: "+52 443 328 3275",
      city: "Pereira", region: "Risaralda" },
    { flag: "mx", name: { es: "México", en: "Mexico" },
      phone: "+52 443 328 3275", whatsapp: "+52 443 328 3275",
      city: "Morelia", region: "México" }
  ],
  fileName: "adrian-iturbide.vcf"
};

/* Textos en ambos idiomas */
const TEXT = {
  es: {
    role: "Gerente General",
    save: "Guardar contacto",
    call: "Llamar", whatsapp: "WhatsApp", email: "Correo",
    website: "Sitio web", linkedin: "LinkedIn",
    location: "Ubicación", online: "En línea",
    showQr: "Mostrar QR", share: "Compartir",
    qrHint: "Pide que escaneen este código con la cámara del celular.",
    close: "Cerrar", copied: "Enlace copiado", saved: "Contacto descargado"
  },
  en: {
    role: "Manager General",
    save: "Save contact",
    call: "Call", whatsapp: "WhatsApp", email: "Email",
    website: "Website", linkedin: "LinkedIn",
    location: "Location", online: "Online",
    showQr: "Show QR", share: "Share",
    qrHint: "Ask them to scan this code with their phone camera.",
    close: "Close", copied: "Link copied", saved: "Contact downloaded"
  }
};
/* ===================================================================== */

const ICONS = {
  call: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  whatsapp: '<path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.3z"/><path d="M9 10c0 3 2 5 5 5l1.2-1.2-2-1-1 .8c-.8-.4-1.4-1-1.8-1.8l.8-1-1-2z"/>',
  location: '<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
  email: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  website: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  linkedin: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/>'
};

const FLAGS = {
  co: '<svg class="flag" viewBox="0 0 6 4" aria-hidden="true"><rect width="6" height="2" fill="#FCD116"/><rect y="2" width="6" height="1" fill="#003893"/><rect y="3" width="6" height="1" fill="#CE1126"/></svg>',
  mx: '<svg class="flag" viewBox="0 0 6 4" aria-hidden="true"><rect width="2" height="4" fill="#006847"/><rect x="2" width="2" height="4" fill="#fff"/><rect x="4" width="2" height="4" fill="#CE1126"/><circle cx="3" cy="2" r=".45" fill="#8c6b2f"/></svg>'
};
const digits = (s) => "+" + s.replace(/\D/g, "");
const vEsc = (s) => String(s).replace(/([\\,;])/g, "\\$1");

let lang =(navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en";
const $ = (id) => document.getElementById(id);
const fullName = `${CONFIG.firstName} ${CONFIG.lastName}`;

function svg(path) {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg>`;
}

function render() {
  const t = TEXT[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
  $("langBtn").textContent = lang === "es" ? "EN" : "ES";

  const list = (items) => `<ul class="links">${items
    .filter(([, href, val]) => href && val)
    .map(([key, href, val]) => `
      <li><a href="${href}" ${href.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}>
        <span class="icon">${svg(ICONS[key])}</span>
        <span><span class="label">${t[key]}</span><span class="value">${val}</span></span>
      </a></li>`).join("")}</ul>`;

  const countries = CONFIG.countries.map(c => {
    const place = [c.city, c.region].filter(Boolean).join(", ");
    return `<div class="group-title">${FLAGS[c.flag]}${c.name[lang]}</div>` + list([
      ["call",     c.phone && `tel:${digits(c.phone)}`,                       c.phone],
      ["whatsapp", c.whatsapp && `https://wa.me/${digits(c.whatsapp).slice(1)}`, c.whatsapp],
      ["location", place && `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place + ", " + c.name.es)}`, place]
    ]);
  }).join("");

  $("links").innerHTML = countries + `<div class="group-title">${t.online}</div>` + list([
    ["email",    `mailto:${CONFIG.email}`, CONFIG.email],
    ["website",  CONFIG.website,  CONFIG.website.replace(/^https?:\/\//, "")],
    ["linkedin", CONFIG.linkedin, CONFIG.linkedin.replace(/^https?:\/\/(www\.)?/, "")]
  ]);

  $("org").innerHTML = `${CONFIG.org} · ` +
    CONFIG.countries.map(c => c.name[lang]).join(" · ");
}

function init() {
  $("name").textContent = fullName;
  const img = CONFIG.photo || CONFIG.logo;
  $("avatar").classList.toggle("is-logo", !CONFIG.photo && !!CONFIG.logo);
  $("avatar").innerHTML = img
    ? `<img src="${img}" alt="${CONFIG.photo ? fullName : CONFIG.org}">`
    : (CONFIG.firstName[0] + CONFIG.lastName[0]);
  render();
}

/* Genera y descarga el archivo .vcf */
function saveContact() {
  const vcf = [
    "BEGIN:VCARD", "VERSION:3.0",
    `N:${vEsc(CONFIG.lastName)};${vEsc(CONFIG.firstName)};;;`,
    `FN:${vEsc(fullName)}`,
    `ORG:${vEsc(CONFIG.org)}`,
    `TITLE:${vEsc(TEXT[lang].role)}`,
    ...CONFIG.countries.flatMap(c => [
      c.phone && `TEL;TYPE=CELL:${digits(c.phone)}`,
      c.whatsapp && c.whatsapp !== c.phone && `TEL;TYPE=CELL:${digits(c.whatsapp)}`,
      `ADR;TYPE=WORK:;;;${vEsc(c.city)};${vEsc(c.region)};;${vEsc(c.name.es)}`
    ]),
    `EMAIL;TYPE=INTERNET:${CONFIG.email}`,
    CONFIG.website  && `URL:${CONFIG.website}`,
    CONFIG.linkedin && `URL;TYPE=LinkedIn:${CONFIG.linkedin}`,
    `NOTE:${location.href}`,
    "END:VCARD"
  ].filter(Boolean).join("\r\n");

  const blob = new Blob([vcf], { type: "text/vcard;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = CONFIG.fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(TEXT[lang].saved);
}

function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2200);
}

let qrDone = false;
function showQr() {
  if (!qrDone && window.QRCode) {
    new QRCode($("qr"), { text: location.href, width: 440, height: 440,
                          colorDark: "#1C2B22", colorLight: "#ffffff",
                          correctLevel: QRCode.CorrectLevel.M });
    qrDone = true;
  }
  $("qrDialog").showModal();
}

async function share() {
  const data = { title: fullName, text: TEXT[lang].role, url: location.href };
  if (navigator.share) { try { await navigator.share(data); } catch (e) {} return; }
  try { await navigator.clipboard.writeText(location.href); toast(TEXT[lang].copied); } catch (e) {}
}

$("langBtn").onclick = () => { lang = lang === "es" ? "en" : "es"; render(); };
$("saveBtn").onclick = saveContact;
$("qrBtn").onclick = showQr;
$("closeQr").onclick = () => $("qrDialog").close();
$("shareBtn").onclick = share;
init();
</script>
</body>
</html>
